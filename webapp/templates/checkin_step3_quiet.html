{% extends "base.html" %}

{% block content %}
  <section>
    <p>Step 3 of 5</p>
    <h2>Phase 1: Micro-Commitment</h2>
    <h3>How quiet is it right now?</h3>
    <p>[icon: tap] Tap once to submit mandatory check-in.</p>

    <form method="post" action="{{ url_for('checkin_step3') }}">
      <button type="submit" name="quietness" value="1">1 - Loud</button>
      <button type="submit" name="quietness" value="2">2 - Some Noise</button>
      <button type="submit" name="quietness" value="3">3 - Moderate</button>
      <button type="submit" name="quietness" value="4">4 - Quiet</button>
      <button type="submit" name="quietness" value="5">5 - Silent</button>
    </form>
  </section>
{% endblock %}
