{% extends "base.html" %}

{% block content %}
  <section class="flow-shell">
    <div class="flow-copy">
      <div class="step-meta">
        <span class="step-chip">+</span>
        <p class="eyebrow">Optional / 2 of 2</p>
      </div>
      <h1 class="step-title">Power</h1>

      <form class="choice-grid" method="post" action="{{ url_for('checkin_step5_optional_outlets') }}">
        <button class="choice-button button--red" type="submit" name="outlets" value="none"><strong>None</strong></button>
        <button class="choice-button button--yellow" type="submit" name="outlets" value="few"><strong>Few</strong></button>
        <button class="choice-button button--blue" type="submit" name="outlets" value="many"><strong>Many</strong></button>
      </form>

      <div class="step-actions">
        <form method="post" action="{{ url_for('checkin_step5_optional_outlets') }}">
          <input type="hidden" name="skip" value="1">
          <button class="button--black button--full" type="submit">Skip</button>
        </form>
      </div>
    </div>

    <div class="flow-geometry" aria-hidden="true">
      <div class="geo-cell geo-yellow"><span class="geo-square"></span></div>
      <div class="geo-cell geo-blue"><span class="geo-circle"></span></div>
      <div class="geo-cell geo-paper"><span class="geo-square"></span></div>
      <div class="geo-cell geo-black"><span class="geo-circle is-black"></span></div>
    </div>
  </section>
{% endblock %}
