{% extends "base.html" %}

{% block content %}
  <section class="hook-shell hook-shell--plain">
    <div class="hook-copy hook-copy--plain">
      <p class="mini-counter" aria-label="Total punches">
        <span data-count-to="{{ punch_count }}">0</span>
      </p>
      <h1 class="step-title">You've punched in!</h1>

      <div class="step-actions">
        <form method="get" action="{{ url_for('checkin_step4_optional_temperature') }}">
          <button class="button--paper button--full" type="submit">Add room details</button>
        </form>

        <form method="get" action="{{ url_for('profile') }}">
          <button class="button--success button--full" type="submit">Done</button>
        </form>
      </div>
    </div>
  </section>

  <script>
    (() => {
      const counter = document.querySelector("[data-count-to]");
      if (!counter) return;

      const target = Number(counter.dataset.countTo || 0);
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!target || reduceMotion) {
        counter.textContent = String(target);
        return;
      }

      const duration = 700;
      const start = performance.now();

      function tick(now) {
        const progress = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        counter.textContent = String(Math.round(eased * target));
        if (progress < 1) {
          window.requestAnimationFrame(tick);
        }
      }

      window.requestAnimationFrame(tick);
    })();
  </script>
{% endblock %}
