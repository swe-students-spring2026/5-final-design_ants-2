{% extends "base.html" %}

{% block content %}
  <section class="hook-shell">
    <div class="hook-copy">
      <p class="eyebrow">Logged</p>
      <h1 class="impact-number">+{{ impact_number }}</h1>
      <p class="impact-label">Students helped</p>

      <div class="summary-list">
        <div class="summary-item"><span>Room</span><strong>{{ checkin_data.room_id }}</strong></div>
        <div class="summary-item"><span>Crowd</span><strong>{{ checkin_data.crowdedness }}</strong></div>
        <div class="summary-item"><span>Quiet</span><strong>{{ checkin_data.quietness }}</strong></div>
      </div>

      <div class="step-actions">
        <form method="get" action="{{ url_for('checkin_step4_optional_temperature') }}">
          <button class="button--paper button--full" type="submit">Add room details</button>
        </form>

        <form method="get" action="{{ url_for('profile') }}">
          <button class="button--success button--full" type="submit">Done</button>
        </form>
      </div>
    </div>

    <div class="hook-geometry" aria-hidden="true">
      <div class="geo-cell geo-green"><span class="geo-circle"></span></div>
      <div class="geo-cell geo-paper"><span class="geo-square"></span></div>
      <div class="geo-cell geo-black"><span class="geo-square is-black"></span></div>
      <div class="geo-cell geo-yellow"><span class="geo-circle is-black"></span></div>
    </div>
  </section>
{% endblock %}
