services:
  mongodb:
    image: mongo:7
    ports:
      - "27019:27017"
    volumes:
      - ${MONGO_DATA_DIR:-./mongodb}:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  checkin-service:
    build:
      context: .
      dockerfile: checkin-service/Dockerfile
    image: incrediblez7/5-final-design_ants-checkin:${TAG:-latest}
    env_file: ./checkin-service/.env
    ports:
      - "${CHECKIN_PORT:-5000}:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  recommendation-service:
    build:
      context: ./recommendation-service
      dockerfile: Dockerfile
    image: incrediblez7/5-final-design_ants-recommendation:${TAG:-latest}
    env_file: ./recommendation-service/.env
    ports:
      - "${RECOMMENDATION_PORT:-8000}:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  webapp:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    image: incrediblez7/5-final-design_ants-webapp:${TAG:-latest}
    env_file: ./checkin-service/.env
    ports:
      - "${WEBAPP_PORT:-3000}:5000"
    depends_on:
      checkin-service:
        condition: service_started
      recommendation-service:
        condition: service_started
    restart: unless-stopped
