services:
  mongodb:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  checkin-service:
    build:
      context: .
      dockerfile: checkin-service/Dockerfile
    image: incrediblez7/5-final-design_ants-checkin:${TAG:-latest}
    env_file: ./checkin-service/.env
    ports:
      - "${CHECKIN_PORT:-5000}:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - DB_NAME=nyu_library_app
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  recommendation-service:
    build: ./recommendation-service
    image: incrediblez7/5-final-design_ants-recommendation:${TAG:-latest}
    env_file: ./recommendation-service/.env
    ports:
      - "${RECOMMENDATION_PORT:-8001}:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - DB_NAME=nyu_library_app
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  webapp:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    image: incrediblez7/5-final-design_ants-webapp:${TAG:-latest}
    ports:
      - "${WEBAPP_PORT:-3000}:3000"
    depends_on:
      checkin-service:
        condition: service_started
      recommendation-service:
        condition: service_started
    restart: unless-stopped
