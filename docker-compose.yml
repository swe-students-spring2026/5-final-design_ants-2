services:
  mongodb:
    image: mongo:7
    volumes:
      - ${MONGO_DATA_DIR:-./mongodb}:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  checkin-service:
    build: ./checkin-service
    image: incrediblez7/5-final-design_ants-checkin:${TAG:-latest}
    ports:
      - "${CHECKIN_PORT:-5000}:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  recommendation-service:
    build: ./recommendation-service
    image: incrediblez7/5-final-design_ants-recommendation:${TAG:-latest}
    ports:
      - "${RECOMMENDATION_PORT:-8000}:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
