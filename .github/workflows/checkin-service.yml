name: checkin-service CI/CD

on:
  push:
    branches: [main, master]
    paths:
      - "checkin-service/**"
      - ".github/workflows/checkin-service.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "checkin-service/**"
      - ".github/workflows/checkin-service.yml"
  workflow_dispatch:

env:
  WORKDIR: checkin-service

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ env.WORKDIR }}/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest with coverage gate
        run: pytest

