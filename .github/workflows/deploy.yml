name: CD

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    env:
      TAG: ${{ vars.DOCKERHUB_TAG }}
      CHECKIN_PORT: ${{ vars.CHECKIN_PORT }}
      RECOMMENDATION_PORT: ${{ vars.RECOMMENDATION_PORT }}
      MONGO_DATA_DIR: ${{ vars.MONGO_DATA_DIR }}
      WEBAPP_PORT: ${{ vars.WEBAPP_PORT }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Write env files for build
        env:
          CHECKIN_ENV: ${{ secrets.CHECKIN_ENV }}
          RECOMMENDATION_ENV: ${{ secrets.RECOMMENDATION_ENV }}
        run: |
          printf '%s' "$CHECKIN_ENV" > checkin-service/.env
          printf '%s' "$RECOMMENDATION_ENV" > recommendation-service/.env

      - name: Build and push images
        run: |
          docker compose build
          docker compose push

      - name: Deploy to server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIV_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ vars.SSH_HOST }} >> ~/.ssh/known_hosts
          ssh ${{ secrets.SSH_USER }}@${{ vars.SSH_HOST }} "mkdir -p ${{ vars.DEPLOY_PATH }}/checkin-service ${{ vars.DEPLOY_PATH }}/recommendation-service"
          scp checkin-service/.env       ${{ secrets.SSH_USER }}@${{ vars.SSH_HOST }}:${{ vars.DEPLOY_PATH }}/checkin-service/.env
          scp recommendation-service/.env ${{ secrets.SSH_USER }}@${{ vars.SSH_HOST }}:${{ vars.DEPLOY_PATH }}/recommendation-service/.env
          ssh ${{ secrets.SSH_USER }}@${{ vars.SSH_HOST }} "\
            export TAG='${{ vars.DOCKERHUB_TAG }}' && \
            export CHECKIN_PORT='${{ vars.CHECKIN_PORT }}' && \
            export RECOMMENDATION_PORT='${{ vars.RECOMMENDATION_PORT }}' && \
            export MONGO_DATA_DIR='${{ vars.MONGO_DATA_DIR }}' && \
            export WEBAPP_PORT='${{ vars.WEBAPP_PORT }}'
            mkdir -p ${{ vars.DEPLOY_PATH }} && \
            cd ${{ vars.DEPLOY_PATH }} && \
            mkdir -p \"\${MONGO_DATA_DIR:-./mongodb}\" && \
            curl -sL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/docker-compose.yml -o docker-compose.yml && \
            docker compose pull && \
            docker compose up -d"