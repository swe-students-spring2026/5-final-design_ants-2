name: CD

on:
  push:
    branches: [dev, prod]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cicd
    env:
      PORT: ${{ github.ref_name == 'prod' && '8080' || '3000' }}
      TAG: ${{ github.ref_name }}
      DEPLOY_DIR: ${{ github.ref_name == 'prod' && '/opt/se/prod' || '/opt/se/dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push images
        run: |
          docker compose build
          docker compose push

      - name: Deploy to server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIV_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "\
            mkdir -p ${{ env.DEPLOY_DIR }} && \
            cd ${{ env.DEPLOY_DIR }} && \
            curl -sL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/docker-compose.yml -o docker-compose.yml && \
            export PORT=${{ env.PORT }} && \
            export TAG=${{ env.TAG }} && \
            docker compose pull && \
            docker compose up -d"